name: Generate profile assets

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Test stats generator
        run: node --test "scripts/profile-stats/test/*.test.js"

      # Stats e activity usam o GITHUB_TOKEN; languages usa o LANGS_TOKEN (PAT
      # fine-grained com "Metadata: read") para incluir repositórios privados.
      - name: Generate stats, activity and languages SVGs
        run: node scripts/profile-stats/main.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LANGS_TOKEN: ${{ secrets.LANGS_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
          OUT_DIR: dist

      - name: Generate snake animation from real contributions
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark&color_snake=#60A5FA&color_dots=#0a1224,#1e3a8a,#2563eb,#3b82f6,#60A5FA

      - name: Push generated files to the output branch
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4.2.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
